services:
  - type: web
    name: proxybot-messenger
    env: node
    region: frankfurt           # choisir la région la plus proche
    plan: starter               # starter = 512MB RAM, toujours allumé si payant
    buildCommand: npm install
    startCommand: node src/app.js
    healthCheckPath: /health

    # Variables d'environnement — à compléter dans le dashboard Render
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      # Facebook Messenger
      - key: PAGE_ACCESS_TOKEN
        sync: false             # à remplir manuellement dans Render

      - key: VERIFY_TOKEN
        sync: false

      - key: APP_SECRET
        sync: false

      # MongoDB Atlas (ou autre)
      - key: MONGODB_URI
        sync: false

      # API Proxy Reselling
      - key: PROXY_API_BASE
        value: https://proxyshop-api-v1.onrender.com

      - key: PROXY_API_EMAIL
        sync: false

      - key: PROXY_API_PASSWORD
        sync: false

      # Admin dashboard
      - key: ADMIN_SECRET_TOKEN
        sync: false

      - key: ADMIN_PSID
        sync: false

      # Prix proxies (optionnel — valeurs par défaut dans le code)
      # - key: PRICE_1_2H
      #   value: "0.35"

    # Autodéploiement depuis GitHub
    autoDeploy: true
